name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable

      - name: Install CMake via SDK manager
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" 2>&1 | tail -5

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Set up release signing
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > veil-release.keystore
          cat > key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../veil-release.keystore
          EOF

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: veil-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Veil ${{ github.ref_name }}
          body: |
            ## Veil ${{ github.ref_name }}

            ### Install on Android
            1. Download `app-release.apk` below
            2. On your Android device, enable **Settings → Install unknown apps** for your browser/Files app
            3. Open the downloaded APK and install

            ### Install on iPhone / iPad (sideload — no Apple account needed)
            Download `Runner.ipa` below, then install it using one of:
            - **Sideloadly** (Windows or Mac) — free, signs with your Apple ID, refreshes every 7 days
            - **AltStore** — same principle, auto-refreshes in background
            - **TrollStore** — permanent install (iOS ≤ 17.0, device-dependent)

            ### What's in this release
            - E2E encrypted messaging (Olm/Megolm — Signal-equivalent)
            - AIM-inspired retro UI
            - Disappearing messages
            - Image, video, and file sharing
            - Group chats

            > Connects to **veilmsg.com** — create an account in-app at first launch.
          files: app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build IPA (unsigned)
        working-directory: app
        run: flutter build ipa --no-codesign --obfuscate --split-debug-info=build/debug-info-ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: veil-ios
          path: app/build/ios/ipa/*.ipa

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Veil ${{ github.ref_name }}
          body: |
            ## Veil ${{ github.ref_name }}

            ### Install on Android
            1. Download `app-release.apk` below
            2. On your Android device, enable **Settings → Install unknown apps** for your browser/Files app
            3. Open the downloaded APK and install

            ### Install on iPhone / iPad (sideload — no Apple account needed)
            Download `Runner.ipa` below, then install it using one of:
            - **Sideloadly** (Windows or Mac) — free, signs with your Apple ID, refreshes every 7 days
            - **AltStore** — same principle, auto-refreshes in background
            - **TrollStore** — permanent install (iOS ≤ 17.0, device-dependent)

            ### What's in this release
            - E2E encrypted messaging (Olm/Megolm — Signal-equivalent)
            - AIM-inspired retro UI
            - Disappearing messages
            - Image, video, and file sharing
            - Group chats

            > Connects to **veilmsg.com** — create an account in-app at first launch.
          files: |
            app/build/ios/ipa/*.ipa
          draft: false
          prerelease: false

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build web
        working-directory: app
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: veil-web
          path: app/build/web/
